<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TxaranGORA | Argazki Galeria</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* KONTENITZAILE NAGUSIA */
    .gallery-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* 1. GOIBURUA (Bakarra eta goian finkatua) */
    .top-bar {
      height: 60px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      background: rgba(0, 0, 0, 0.6);
      z-index: 200;
    }

    .top-bar h1 {
      font-size: 1.3rem;
      color: #e1bee7;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .close-link {
      color: #ffffff;
      font-size: 2.5rem;
      text-decoration: none;
      line-height: 1;
      cursor: pointer;
      transition: color 0.2s;
    }
    .close-link:hover { color: #e1bee7; }

    /* 2. ARGAZKI GUNEA (Irudia handi erakusteko) */
    .image-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px;
      overflow: hidden;
    }

    .image-area img {
      max-width: 95vw;
      max-height: 80vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.9);
    }

    /* 3. GEZIAK (Bakarrak eta bazterretan) */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(123, 31, 162, 0.8);
      color: white;
      border: none;
      font-size: 1.8rem;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      user-select: none;
      transition: background 0.2s, transform 0.2s;
    }
    .nav-arrow:hover {
      background: #9c27b0;
      transform: translateY(-50%) scale(1.1);
    }
    .nav-arrow.prev { left: 15px; }
    .nav-arrow.next { right: 15px; }

    /* 4. BEHEKO KONTAGAILUA */
    .bottom-bar {
      height: 45px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      z-index: 200;
    }

    .counter-text {
      font-size: 1rem;
      color: #dddddd;
    }
  </style>
</head>
<body>

  <div class="gallery-container">
    <!-- GOIBURUA -->
    <div class="top-bar">
      <h1 id="townTitle">TxaranGORA - Galeria</h1>
      <a href="javascript:void(0)" onclick="itxiGaleria()" class="close-link" title="Itxi">&times;</a>

    </div>

    <!-- ERDIALDEA: Irudia eta Geziak -->
    <div class="image-area">
      <button class="nav-arrow prev" id="btnPrev" aria-label="Aurrekoa">◄</button>
      <img id="mainImg" src="" alt="Galeriako irudia">
      <button class="nav-arrow next" id="btnNext" aria-label="Hurrengoa">►</button>
    </div>

    <!-- BEHEALDEA -->
    <div class="bottom-bar">
      <div class="counter-text" id="imgCounter"></div>
    </div>
  </div>

  <script>
    // 1. Irudien bidea sortzeko funtzioa (adib. irun2026/1.jpg)
    function sortuZerrenda(karpeta, kopurua) {
      const zerrenda = [];
      for (let i = 1; i <= kopurua; i++) {
        zerrenda.push(`${karpeta}/${i}.jpg`);
      }
      return zerrenda;
    }

    // 2. Herri bakoitzaren karpeta eta argazki kopurua
    const galeriak = {
      "Irun": sortuZerrenda("irun2026", 8),
      "Tolosa": sortuZerrenda("tolosa2026", 12),
      "Villabona": sortuZerrenda("villabona2026", 5)
    };

    // 3. URLtik herria irakurri (?herria=Irun)
    const urlParams = new URLSearchParams(window.location.search);
    const herria = urlParams.get('herria') || "Irun";

    document.getElementById('townTitle').textContent = `TxaranGORA - ${herria}`;

    const argazkiak = galeriak[herria] || [];
    let currentIndex = 0;

    const mainImg = document.getElementById('mainImg');
    const imgCounter = document.getElementById('imgCounter');

    function showImage(index) {
      if (!argazkiak || argazkiak.length === 0) {
        imgCounter.textContent = "Ez da argazkirik aurkitu.";
        mainImg.style.display = "none";
        return;
      }
      currentIndex = index;
      mainImg.src = argazkiak[currentIndex];
      mainImg.style.display = "block";
      imgCounter.textContent = `${currentIndex + 1} / ${argazkiak.length}`;
    }

    // Gezien klik gertaerak
    document.getElementById('btnPrev').onclick = function() {
      if (argazkiak.length === 0) return;
      currentIndex = (currentIndex - 1 + argazkiak.length) % argazkiak.length;
      showImage(currentIndex);
    };

    document.getElementById('btnNext').onclick = function() {
      if (argazkiak.length === 0) return;
      currentIndex = (currentIndex + 1) % argazkiak.length;
      showImage(currentIndex);
    };

    // Teklatuko geziak (← eta →)
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') document.getElementById('btnPrev').click();
      if (e.key === 'ArrowRight') document.getElementById('btnNext').click();
      if (e.key === 'Escape') history.back();
    });

  function itxiGaleria() {
  if (document.referrer && document.referrer.includes(window.location.host)) {
    history.back();
  } else {
    window.location.href = "index.html"; // Zure orri nagusia
  }
}

    // Hasieratu
    showImage(0);
  </script>
</body>
</html>
