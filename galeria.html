<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TxaranGORA | Argazki Galeria</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0d0d0d;
      color: white;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .gallery-header {
      position: absolute;
      top: 20px;
      left: 30px;
      right: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .gallery-title { font-size: 1.4rem; color: #e1bee7; font-weight: bold; }
    .close-btn { color: white; font-size: 2.2rem; cursor: pointer; text-decoration: none; font-weight: bold; }
    .image-container {
      position: relative;
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .image-container img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      object-fit: contain;
    }
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(123, 31, 162, 0.7);
      color: white;
      border: none;
      font-size: 1.8rem;
      padding: 12px 20px;
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.3s, transform 0.2s;
      z-index: 5;
    }
    .arrow:hover { background: #7b1fa2; transform: translateY(-50%) scale(1.1); }
    .arrow.left { left: 20px; }
    .arrow.right { right: 20px; }
    .caption { margin-top: 15px; font-size: 1rem; color: #ccc; }
    .loading { font-size: 1.2rem; color: #e1bee7; }
  </style>
</head>
<body>

  <div class="gallery-header">
    <div class="gallery-title" id="townTitle">TxaranGORA Galeria</div>
    <span class="close-btn" onclick="window.close()">&times;</span>
  </div>

  <button class="arrow left" id="prevImg">◄</button>

  <div class="image-container">
    <div id="loading" class="loading">Argazkiak kargatzen...</div>
    <img id="mainImg" src="" alt="Galeria argazkia" style="display: none;">
  </div>

  <button class="arrow right" id="nextImg">►</button>

  <div class="caption" id="imgCounter"></div>

  <script>
    // Bakarrik herri bakoitzaren Nextcloud tokena jarri behar duzu hemen.
    // Adibidez esteka https://ni.eus/s/a1b2c3d4 bada, tokena "a1b2c3d4" da.
    const herriTokens = {
      "Tolosa": "TOLOSA_TOKENA_HEMEN",
      "Irun": "gg6CqgWmgsY5LQ5",
      "Villabona": "VILLABONA_TOKENA_HEMEN"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const herria = urlParams.get('herria') || "Tolosa";
    document.getElementById('townTitle').textContent = `TxaranGORA - ${herria}`;

    const token = herriTokens[herria];
    let images = [];
    let currentIndex = 0;

    const mainImg = document.getElementById('mainImg');
    const loading = document.getElementById('loading');
    const imgCounter = document.getElementById('imgCounter');

    // Nextcloud-eko fitxategi zerrenda automatikoki irakurri ( WebDAV bidez )
    if (token) {
      fetch('https://ni.eus/public.php/webdav/', {
        method: 'PROPFIND',
        headers: { 'Authorization': 'Basic ' + btoa(token + ':') }
      })
      .then(res => res.text())
      .then(xmlText => {
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "text/xml");
        const hrefs = Array.from(xml.querySelectorAll("href, d\\:href"));
        
        images = hrefs
          .map(h => h.textContent)
          .filter(path => /\.(jpg|jpeg|png|gif|webp)\$/i.test(path))
          .map(path => {
            const fileName = path.split('/').pop();
            return `https://ni.eus/s/${token}/download?path=&files=${encodeURIComponent(fileName)}`;
          });

        if (images.length > 0) {
          loading.style.display = 'none';
          mainImg.style.display = 'block';
          showImage(0);
        } else {
          loading.textContent = "Ez da argazkirik aurkitu karpeta honetan.";
        }
      })
      .catch(() => {
        loading.textContent = "Errorea kargatzean. Egiaztatu esteka eta baimenak.";
      });
    }

    function showImage(index) {
      if (images.length === 0) return;
      currentIndex = index;
      mainImg.src = images[currentIndex];
      imgCounter.textContent = `${currentIndex + 1} / ${images.length}`;
    }

    document.getElementById('prevImg').addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      showImage(currentIndex);
    });

    document.getElementById('nextImg').addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % images.length;
      showImage(currentIndex);
    });
  </script>
</body>
</html>
