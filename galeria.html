<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TxaranGORA | Argazki Galeria</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0d0d0d;
      color: white;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .gallery-header {
      position: absolute;
      top: 20px;
      left: 30px;
      right: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .gallery-title { font-size: 1.4rem; color: #e1bee7; font-weight: bold; }
    .close-btn { color: white; font-size: 2.2rem; cursor: pointer; text-decoration: none; font-weight: bold; }
    .image-container {
      position: relative;
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .image-container img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      object-fit: contain;
    }
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(123, 31, 162, 0.7);
      color: white;
      border: none;
      font-size: 1.8rem;
      padding: 12px 20px;
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.3s, transform 0.2s;
      z-index: 5;
    }
    .arrow:hover { background: #7b1fa2; transform: translateY(-50%) scale(1.1); }
    .arrow.left { left: 20px; }
    .arrow.right { right: 20px; }
    .caption { margin-top: 15px; font-size: 1rem; color: #ccc; }
    .loading { font-size: 1.2rem; color: #e1bee7; }
  </style>
</head>
<body>

  <div class="gallery-header">
    <div class="gallery-title" id="townTitle">TxaranGORA Galeria</div>
    <span class="close-btn" onclick="window.close()">&times;</span>
  </div>

  <button class="arrow left" id="prevImg">◄</button>

  <div class="image-container">
    <div id="loading" class="loading">Argazkiak kargatzen...</div>
    <img id="mainImg" src="" alt="Galeria argazkia" style="display: none;">
  </div>

  <button class="arrow right" id="nextImg">►</button>

  <div class="caption" id="imgCounter"></div>

<script>
  // Funtzio honek zuzenean "karpeta/zenbakia.jpg" bidea sortzen du (adib. irun2026/1.jpg)
  function sortuZerrenda(karpetaIzena, kopurua) {
    const zerrenda = [];
    for (let i = 1; i <= kopurua; i++) {
      zerrenda.push(`${karpetaIzena}/${i}.jpg`);
    }
    return zerrenda;
  }

  // Hemen jarri karpeta bakoitzaren izen zehatza eta barruko argazki kopurua:
  const galeriak = {
    "Tolosa": sortuZerrenda("tolosa2026", 12),     // tolosa2026/1.jpg, tolosa2026/2.jpg... (12 argazki)
    "Irun": sortuZerrenda("irun2026", 8),          // irun2026/1.jpg, irun2026/2.jpg... (8 argazki)
    "Villabona": sortuZerrenda("villabona2026", 5) // villabona2026/1.jpg... (5 argazki)
  };

  // URLtik herriaren izena jaso (?herria=Tolosa)
  const urlParams = new URLSearchParams(window.location.search);
  const herria = urlParams.get('herria') || "Tolosa";
  document.getElementById('townTitle').textContent = `TxaranGORA - ${herria}`;

  const argazkiak = galeriak[herria] || [];
  let currentIndex = 0;

  const mainImg = document.getElementById('mainImg');
  const imgCounter = document.getElementById('imgCounter');

  function showImage(index) {
    if (!argazkiak || argazkiak.length === 0) {
      imgCounter.innerHTML = "<span style='color:#ffb74d;'>Ez da argazkirik aurkitu herri honetarako.</span>";
      mainImg.style.display = "none";
      return;
    }
    currentIndex = index;
    mainImg.src = argazkiak[currentIndex];
    mainImg.style.display = "block";
    imgCounter.textContent = `${currentIndex + 1} / ${argazkiak.length}`;
  }

  // Ezkerreko gezia (Aurrekoa)
  document.getElementById('prevImg').addEventListener('click', () => {
    if (argazkiak.length === 0) return;
    currentIndex = (currentIndex - 1 + argazkiak.length) % argazkiak.length;
    showImage(currentIndex);
  });

  // Eskuineko gezia (Hurrengoa)
  document.getElementById('nextImg').addEventListener('click', () => {
    if (argazkiak.length === 0) return;
    currentIndex = (currentIndex + 1) % argazkiak.length;
    showImage(currentIndex);
  });

  // Hasieratu galeria
  showImage(0);
</script>



</body>
</html>
